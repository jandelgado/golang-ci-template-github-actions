on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

name: Upload release assets after tagging
jobs:
  build:
    name: create assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 # buildx-stable-1

      - name: Log in to the Container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2
          # the container image is built, scanned and pushed by
          # container.yml on every push to master; here we only promote
          # the already-scanned image (see below), so the docker pipe is
          # skipped rather than rebuilding it
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build once, use many times: retag the exact image that was already
      # scanned by container.yml for this commit, instead of rebuilding it.
      - name: Promote scanned image to release tags
        run: |
          set -euo pipefail
          tags=(--tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}")
          # simple prerelease check: real releases are "vX.Y.Z", prereleases
          # like "vX.Y.Z-rc1" contain a hyphen and don't get "latest"
          if [[ "${{ github.ref_name }}" != *-* ]]; then
            tags+=(--tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"