# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
project_name: go-ci-demo
builds:
  - binary: my-app
    env:
      - CGO_ENABLED=0
    dir: .
    ldflags:
      - -s -w
      - -X "main.BuildVersion={{.Tag}}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
archives:
  - files:
      - README.md
      - LICENSE
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
# the container image is built, scanned and pushed by
# .github/workflows/container.yml on every push to master, tagged by commit
# SHA; .github/workflows/upload_assets.yml promotes that same image to the
# release tag and "latest" instead of rebuilding it here, so there is no
# dockers_v2 pipe in this config.

release:
  prerelease: auto

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'