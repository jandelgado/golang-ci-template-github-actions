# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
# Deliberately no `before: hooks: - go mod tidy`: a hook that rewrites go.mod
# and go.sum mid-build would let a release be built from different
# dependencies than the ones committed, without anyone noticing. The "run
# tests" workflow asserts the module is tidy with `go mod tidy -diff` instead,
# which fails rather than silently fixing it.
project_name: go-ci-demo
builds:
  - binary: my-app
    env:
      - CGO_ENABLED=0
    dir: .
    ldflags:
      - -s -w
      # .Version renders "1.2.3" for a release and "1.2.4-next" for a snapshot
      # build, so a binary never claims to be a release it isn't. It is also
      # the value used for org.opencontainers.image.version below, so the
      # binary and the image it ships in always agree.
      - -X "main.BuildVersion={{.Version}}"
      - -X "main.BuildCommit={{.FullCommit}}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
archives:
  - files:
      - README.md
      - LICENSE
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
dockers_v2:
  - ids:
      - go-ci-demo
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_NAME }}"
    tags:
      - "{{ .FullCommit }}"
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.source: "https://github.com/{{ .Env.IMAGE_NAME }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      org.opencontainers.image.source: "https://github.com/{{ .Env.IMAGE_NAME }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  prerelease: auto

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
